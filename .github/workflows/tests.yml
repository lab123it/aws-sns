name: tests

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.1', laravel: '^10.0', testbench: '^8.0', stability: prefer-lowest }
          - { php: '8.2', laravel: '^10.0', testbench: '^8.0', stability: prefer-lowest }
          - { php: '8.2', laravel: '^11.0', testbench: '^9.0', stability: prefer-lowest }
          - { php: '8.3', laravel: '^11.0', testbench: '^9.0', stability: prefer-lowest }
          - { php: '8.2', laravel: '^12.0', testbench: '^10.0', stability: prefer-lowest }
          - { php: '8.4', laravel: '^12.0', testbench: '^10.0', stability: prefer-lowest }
          - { php: '8.3', laravel: '^13.0', testbench: '^11.0', stability: prefer-lowest }
          - { php: '8.5', laravel: '^13.0', testbench: '^11.0', stability: prefer-lowest }
          - { php: '8.1', laravel: '^10.0', testbench: '^8.0', stability: prefer-stable }
          - { php: '8.2', laravel: '^10.0', testbench: '^8.0', stability: prefer-stable }
          - { php: '8.2', laravel: '^11.0', testbench: '^9.0', stability: prefer-stable }
          - { php: '8.3', laravel: '^11.0', testbench: '^9.0', stability: prefer-stable }
          - { php: '8.2', laravel: '^12.0', testbench: '^10.0', stability: prefer-stable }
          - { php: '8.4', laravel: '^12.0', testbench: '^10.0', stability: prefer-stable }
          - { php: '8.3', laravel: '^13.0', testbench: '^11.0', stability: prefer-stable }
          - { php: '8.5', laravel: '^13.0', testbench: '^11.0', stability: prefer-stable }

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.stability }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - run: >
          composer update --${{ matrix.stability }}
          --with "laravel/framework:${{ matrix.laravel }}"
          --with "orchestra/testbench:${{ matrix.testbench }}"
          --no-interaction --no-progress

      - run: composer test
