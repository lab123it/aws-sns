name: lint

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - run: composer global require laravel/pint --no-interaction --no-progress

      - run: $(composer global config bin-dir --absolute --quiet)/pint --test
